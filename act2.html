<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Audio Video</title>
</head>

<body>

    <!-- Audio -->
    <audio controls autoplay>
        <source
            src="https://raw.githubusercontent.com/almacode1703/sample-sounds/main/berry-groovy-bass-trap-476603.mp3"
            type="audio/mp3">
    </audio>



    <!-- Video -->

    <video controls autoplay width="500px">
        <source src="https://www.pexels.com/download/video/35554165/" type="video/mp4">
    </video>

</body>

</html>
